name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify frontend script syntax
        run: node --check static/app.js

      - name: Run Python checks
        run: ./scripts/check.sh

      - name: Start local server
        env:
          PICGEN_DEFAULT_EDIT_URL: https://sub.tidba.com/v1/images/edits
        run: |
          ./scripts/start.sh > /tmp/picgen-ci.log 2>&1 &
          echo $! > /tmp/picgen-ci.pid

      - name: Wait for health endpoint
        run: |
          uv run python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/api/health"
          last_error = None

          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if response.status == 200 and payload.get("ok") is True:
                      raise SystemExit(0)
                  last_error = f"unexpected payload: {payload!r}"
              except Exception as exc:
                  last_error = str(exc)
                  time.sleep(0.25)

          raise SystemExit(f"health check failed: {last_error}")
          PY

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/picgen-ci.pid ]; then
            kill "$(cat /tmp/picgen-ci.pid)" || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picgen-ci-log
          path: /tmp/picgen-ci.log
          if-no-files-found: ignore
